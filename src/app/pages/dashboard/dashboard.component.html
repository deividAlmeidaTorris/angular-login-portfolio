<div class="dashboard-container">
  <h1>Bem-vindo ao Painel!</h1>
  <p>Olá, Admin</p>

  <!-- CARDS DE INFORMAÇÃO -->
  <div class="cards">
    <div class="card">
      <h2>Usuários</h2>
      <p>2 cadastrados</p>
    </div>
    <div class="card">
      <h2>Novidades</h2>
      <p>3 notificações</p>
    </div>
    <div class="card">
      <h2>Configurações</h2>
      <p>Atualize seu perfil</p>
    </div>
  </div>

  <!-- LINKS RÁPIDOS / BOTÕES -->
  <div class="quick-links">
    <button class="quick-btn" (click)="goToAddUser()">Adicionar Usuário</button>
    <button class="quick-btn" (click)="goToListUsers()">Listar Usuários</button>
    <button class="quick-btn">Configurações</button>
  </div>
</div>
